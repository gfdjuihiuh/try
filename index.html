<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek</title>
  <style>
    :root {
      --brand: #4d6bfe;
      --brand-dark: #3a56d4;
      --text: #1f2430;
      --muted: #6b7280;
      --bg: #f4f6fb;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #eef2ff 0%, var(--bg) 45%, #e8f0ff 100%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border-radius: 20px;
      padding: 48px 44px;
      box-shadow: 0 20px 60px rgba(77, 107, 254, 0.12);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo .whale { font-size: 34px; line-height: 1; }
    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .intro {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
      text-align: justify;
      margin-bottom: 36px;
    }
    .jump-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .jump-row {
      display: flex;
      gap: 10px;
    }
    .jump-row input {
      flex: 1;
      height: 48px;
      padding: 0 16px;
      font-size: 15px;
      border: 1.5px solid #e2e6f0;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .jump-row input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(77, 107, 254, 0.12);
    }
    .jump-row button {
      height: 48px;
      padding: 0 26px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--brand);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .jump-row button:hover { background: var(--brand-dark); }
    .jump-row button:active { transform: translateY(1px); }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #9aa1b2;
    }
    .msg {
      margin-top: 10px;
      font-size: 13px;
      color: #e5484d;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="whale">🐋</span>
      <h1>DeepSeek</h1>
    </div>

    <p class="intro">
      DeepSeek（深度求索）是一家中国人工智能公司，由幻方量化于 2023 年创立，
      专注于研发先进的大语言模型。公司秉持开源、普惠的理念，先后发布了
      DeepSeek-V2、DeepSeek-V3、DeepSeek-Coder 及擅长推理的 DeepSeek-R1 等模型。
      2025 年初，R1 以卓越的推理能力和极低的训练成本引发全球关注，被评价为用
      远低于同类大模型的成本达到了国际顶尖水平。其产品覆盖对话助手与编程助手，
      支持网页、App 与 API 等多种使用方式，致力于让智能触手可及。
    </p>

    <div class="jump-label">输入网址，直接进入</div>
    <div class="jump-row">
      <input id="url" type="text" placeholder="例如 baidu.com 或 https://..." autocomplete="off" spellcheck="false" />
      <button id="go">进入</button>
    </div>
    <div class="hint">按回车键或点击「进入」，将在当前页跳转到目标网站</div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    var input = document.getElementById('url');
    var go = document.getElementById('go');
    var msg = document.getElementById('msg');

    function jump() {
      var raw = input.value.trim();
      msg.textContent = '';
      if (!raw) { input.focus(); return; }

      // 已显式带协议但不是 http/https（如 javascript:、ftp:、mailto:），直接拒绝
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(raw) && !/^https?:\/\//i.test(raw)) {
        msg.textContent = '仅支持 http:// 或 https:// 网址';
        input.focus();
        return;
      }

      var url = raw;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      window.location.href = url;
    }

    go.addEventListener('click', jump);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') jump();
    });
    input.focus();
  </script>
</body>
</html>
